<div style="padding: 8px; font-family: sans-serif;">
  <h3>Clasificador de Video</h3>
  <button id="importar" disabled>Importar clasificacion...</button>
  <!-- Solo mientras el arnes de pruebas este encendido; se va con el spike. -->
  <button id="correr-pruebas">Correr pruebas</button>
  <div id="status" style="margin-top: 8px;">Listo.</div>
  <div id="log-list" style="margin-top: 8px; font-size: 12px; max-height: 400px; overflow-y: auto;"></div>
</div>
<script src="js/log.js"></script>
<script src="js/autocheck.js"></script>
<script src="js/premiereActions.js"></script>
<script src="js/bins.js"></script>
<script src="js/importClip.js"></script>
<script src="js/label.js"></script>
<script src="js/inOut.js"></script>
<script src="js/proxy.js"></script>
<script src="js/processManifest.js"></script>
<script src="js/importarManifest.js"></script>
<script src="js/secuencia.js"></script>
<script src="js/autocheck-tests.js"></script>
<script src="js/spike-lut.js"></script>
<script>
  logToPanel("Plugin cargado.");
  correrAutocheck();

  // El panel carga junto con Premiere, antes de que haya proyecto abierto:
  // sin este boton, la unica corrida posible era la del arranque y siempre
  // decia «no hay proyecto» aunque si lo hubiera.
  const botonPruebas = document.getElementById("correr-pruebas");
  botonPruebas.addEventListener("click", async () => {
    botonPruebas.disabled = true;
    document.getElementById("log-list").innerHTML = "";
    try {
      await correrAutocheck();
    } catch (e) {
      logToPanel(e.message + " | " + e.stack, true);
    } finally {
      botonPruebas.disabled = false;
    }
  });

  const boton = document.getElementById("importar");
  boton.disabled = false;
  boton.addEventListener("click", async () => {
    boton.disabled = true;
    try {
      await importarManifestDesdeArchivo();
    } catch (e) {
      logToPanel(e.message + " | " + e.stack, true);
      document.getElementById("status").textContent = "Listo.";
    } finally {
      boton.disabled = false;
    }
  });
</script>

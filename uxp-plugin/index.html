<meta charset="utf-8">
<style>
  /* El panel vive DENTRO de Premiere, asi que se viste como Premiere: grises
     planos, controles chicos, texto discreto. El unico color propio es el
     ambar de Clipify (`theme.ICON_AMBER_TOP`), y solo donde hay que decidir
     algo -- la pestana activa, el chip prendido, el boton que de verdad
     aprietas. Un panel que grita distinto a la app que lo hospeda se lee como
     un pegote, y este vive pegado a la ventana de proyecto todo el dia.

     Los controles se pintan A MANO porque el default del sistema son cajas
     BLANCAS: sobre el gris de Premiere eran lo mas llamativo del panel, mas
     que el texto. Bruno, viendolo en vivo: «la interface esta horrible». */
  :root {
    --tinta: #d6d6d6;         /* texto normal */
    --tinta-2: #9a9a9a;       /* etiquetas y explicaciones */
    --tinta-3: #6f6f6f;       /* lo que casi no importa */
    --linea: #3a3a3a;
    --panel: #2b2b2b;         /* el gris del panel, declarado y no heredado */
    --hueco: #1c1c1c;         /* fondo de campos: mas oscuro que el panel */
    --control: #3a3a3a;       /* botones en reposo */
    --control-2: #484848;     /* botones con el mouse encima */
    --ambar: #f0b429;
    --ambar-tinta: #1a1204;   /* texto sobre ambar */
    --alarma: #e06c75;
    --montado: #6abf69;      /* palomita: verde de "montado", no ambar ni azul */
  }

  /* El fondo se declara AQUI y no se hereda del host. Premiere tiene cuatro
     niveles de brillo en sus preferencias, y sin esto un tema claro dejaba el
     texto blanco sobre blanco: la lista de cuartos desaparecia entera. Se vio
     pasar al sacar la captura en un navegador, que tampoco trae fondo. */
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 12px; color: var(--tinta); margin: 0;
    background: var(--panel);
  }

  /* --- Pestanas ------------------------------------------------ */
  .barra-pestanas { display: flex; border-bottom: 1px solid var(--linea); }
  .pestana {
    padding: 7px 12px; cursor: pointer; border: none; background: none;
    color: var(--tinta-2); font-size: 12px; border-bottom: 2px solid transparent;
  }
  .pestana:hover { color: var(--tinta); }
  .pestana.activa { color: var(--ambar); border-bottom-color: var(--ambar); }

  .hoja { padding: 10px 12px 14px; }
  .oculto { display: none; }

  /* --- Controles ----------------------------------------------- */
  input[type="text"], textarea {
    width: 100%; box-sizing: border-box;
    background: var(--hueco); color: var(--tinta);
    border: 1px solid var(--linea); border-radius: 3px;
    padding: 5px 7px; font: inherit;
  }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: #5a5a5a; }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--tinta-3); }
  textarea { resize: vertical; min-height: 58px; }

  button {
    background: var(--control); color: var(--tinta);
    border: 1px solid var(--linea); border-radius: 3px;
    padding: 5px 11px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--control-2); }
  button:disabled { opacity: .45; cursor: default; }

  /* El que de verdad aprietas en cada pestana. Uno por pantalla: si todos
     fueran ambar, el ambar dejaria de decir nada. */
  button.principal {
    background: var(--ambar); color: var(--ambar-tinta);
    border-color: var(--ambar); font-weight: 600;
  }
  button.principal:hover:not(:disabled) { background: #ffc648; }

  /* --- La guia de edicion --------------------------------------- */
  /* La pestana LEE el guion y guarda tu avance. Ni llave ni preguntas: se
     fueron el 2026-09-14, la guia se arma en Clipify. */
  .guia-cab {
    padding: 10px 12px; border-bottom: 1px solid var(--linea);
    background: #262626; margin: -10px -12px 10px;
  }
  .guia-cab-chico {
    color: var(--tinta-3); text-transform: uppercase;
    letter-spacing: .5px; font-size: 10px;
  }
  .guia-cab-grande { color: #f4f4f4; font-size: 15px; font-weight: 600; margin-top: 2px; }
  .guia-cab-cuenta { color: var(--tinta-2); margin-top: 5px; font-size: 11px; }

  .guia-recorrido { margin: 0 0 12px; line-height: 1.5; color: var(--tinta); }
  .guia-paso {
    display: flex; gap: 7px; align-items: baseline;
    padding: 4px 6px; border-radius: 3px; line-height: 1.45;
  }
  /* A mano, como el resto de los controles del panel (ver el comentario
     que abre este <style>): el default del sistema son cajas blancas con
     azul brillante, y con ocho pasos esas cajas eran lo mas llamativo del
     panel, mas que el texto. */
  .guia-palomita {
    appearance: none; -webkit-appearance: none;
    margin: 0; align-self: center; flex-shrink: 0;
    width: 13px; height: 13px; border-radius: 3px;
    background: var(--hueco); border: 1px solid var(--linea);
    cursor: pointer; position: relative;
  }
  .guia-palomita:hover { border-color: var(--tinta-3); }
  /* Verde de "montado", no ambar: el ambar de este panel es para lo que
     hay que decidir, y palomear un paso ya no es una decision pendiente. */
  .guia-palomita:checked {
    background: var(--montado); border-color: var(--montado);
  }
  .guia-palomita:checked::after {
    content: "\2713"; position: absolute; left: 0; top: -3px;
    width: 100%; text-align: center; font-size: 12px; line-height: 1;
    color: #1a2b0f;
  }
  .guia-num {
    color: var(--tinta-3); min-width: 16px;
    font-variant-numeric: tabular-nums;
  }
  .guia-cuarto { color: #f4f4f4; }
  .guia-porque { color: var(--tinta-3); }
  /* El renglon que se salio del patron de Bruno va en ambar y en cursiva: es
     informacion que solo tenia la IA, y es lo unico de la lista que hay que
     leer con atencion. Mismo trato que le da la pantalla de Clipify. */
  .guia-porque.fuera-del-patron { color: var(--ambar); font-style: italic; }
  /* Un paso montado se tacha y se calla. */
  .guia-paso.montado .guia-cuarto,
  .guia-paso.montado .guia-num { color: #5f5f5f; text-decoration: line-through; }
  /* En el que vas: un filo ambar, que es donde el ojo cae solo. */
  .guia-paso.ahora { background: rgba(240,180,41,.10); box-shadow: inset 2px 0 0 var(--ambar); }
  /* «Otra vez» va en azul y no en ambar: no es un aviso, es un dato. El
     ambar de este panel esta reservado para lo que hay que decidir. */
  .guia-otravez {
    color: #7a9cc6; font-size: 10px; border: 1px solid #3f556b;
    border-radius: 8px; padding: 0 5px;
  }

  .tenue { color: var(--tinta-2); line-height: 1.45; }

  /* --- La pestana de importar ----------------------------------- */
  #status { margin-top: 8px; color: var(--tinta-2); }
  #log-list {
    margin-top: 10px; font-size: 11px; line-height: 1.5;
    max-height: 400px; overflow-y: auto;
    border-top: 1px solid var(--linea); padding-top: 8px;
    color: var(--tinta-2);
  }
</style>

<div class="barra-pestanas">
  <button class="pestana activa" id="tab-importar">Importar</button>
  <button class="pestana" id="tab-orden">Guía de edición</button>
</div>

<div class="hoja" id="hoja-importar">
  <button class="principal" id="importar" disabled>Importar clasificación…</button>
  <div id="status">Listo.</div>
  <div id="log-list"></div>
</div>

<div class="hoja oculto" id="hoja-orden"></div>

<script src="js/log.js"></script>
<script src="js/autocheck.js"></script>
<script src="js/premiereActions.js"></script>
<!-- Antes que `bins.js` y `estructura.js`, que lo usan. -->
<script src="js/numeroDeCuarto.js"></script>
<script src="js/bins.js"></script>
<script src="js/estructura.js"></script>
<script src="js/importClip.js"></script>
<script src="js/label.js"></script>
<script src="js/nombre.js"></script>
<script src="js/inOut.js"></script>
<script src="js/proxy.js"></script>
<script src="js/processManifest.js"></script>
<script src="js/importarManifest.js"></script>
<script src="js/secuencia.js"></script>
<script src="js/avance.js"></script>
<script src="js/avanceDisco.js"></script>
<script src="js/pestanaOrden.js"></script>
<script src="js/autocheck-tests.js"></script>
<script>
  logToPanel("Plugin cargado.");
  correrAutocheck();

  const boton = document.getElementById("importar");
  boton.disabled = false;
  boton.addEventListener("click", async () => {
    boton.disabled = true;
    try {
      await importarManifestDesdeArchivo();
    } catch (e) {
      logToPanel(e.message + " | " + e.stack, true);
      document.getElementById("status").textContent = "Listo.";
    } finally {
      boton.disabled = false;
    }
  });

  // Las pestanas. La de importar es la que Bruno usa todos los dias, asi que
  // es la que abre.
  const pestanas = [
    { boton: document.getElementById("tab-importar"), hoja: document.getElementById("hoja-importar") },
    { boton: document.getElementById("tab-orden"), hoja: document.getElementById("hoja-orden") },
  ];
  for (const { boton: b, hoja } of pestanas) {
    b.addEventListener("click", () => {
      for (const p of pestanas) {
        const esta = p.boton === b;
        p.boton.classList.toggle("activa", esta);
        p.hoja.classList.toggle("oculto", !esta);
      }
      if (hoja.id === "hoja-orden") abrirPestanaOrden();
    });
  }
</script>

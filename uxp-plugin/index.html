<style>
  body { font-family: sans-serif; font-size: 13px; }
  .barra-pestanas { display: flex; border-bottom: 1px solid #3a3a3a; }
  .pestana {
    padding: 8px 14px; cursor: pointer; border: none; background: none;
    color: #b8b8b8; font-size: 13px; border-bottom: 2px solid transparent;
  }
  .pestana.activa { color: #f0b429; border-bottom-color: #f0b429; }
  .hoja { padding: 10px; }
  .oculto { display: none; }
  .chip {
    display: inline-block; margin: 2px 4px 2px 0; padding: 4px 10px;
    border: 1px solid #555; border-radius: 12px; cursor: pointer; color: #d0d0d0;
  }
  .chip.prendido { border-color: #f0b429; color: #f0b429; }
  .pregunta { margin-bottom: 10px; }
  .pregunta > label { display: block; margin-bottom: 4px; color: #b8b8b8; }
  .aviso {
    border-left: 3px solid #e06c75; padding: 6px 10px; margin-bottom: 10px;
    color: #e0a0a0;
  }
  .renglon-cuarto { margin-bottom: 6px; }
  .renglon-cuarto .nombre { color: #e8e8e8; }
  .renglon-cuarto .porque { color: #999; }
  .renglon-cuarto.inventado .nombre { text-decoration: line-through; color: #e06c75; }
  input[type="text"], textarea { width: 100%; box-sizing: border-box; }
  .tenue { color: #888; }
</style>

<div class="barra-pestanas">
  <button class="pestana activa" id="tab-importar">Importar</button>
  <button class="pestana" id="tab-orden">Orden sugerido</button>
</div>

<div class="hoja" id="hoja-importar">
  <button id="importar" disabled>Importar clasificacion...</button>
  <div id="status" style="margin-top: 8px;">Listo.</div>
  <div id="log-list" style="margin-top: 8px; font-size: 12px; max-height: 400px; overflow-y: auto;"></div>
</div>

<div class="hoja oculto" id="hoja-orden"></div>

<script src="js/log.js"></script>
<script src="js/autocheck.js"></script>
<script src="js/premiereActions.js"></script>
<script src="js/bins.js"></script>
<script src="js/estructura.js"></script>
<script src="js/importClip.js"></script>
<script src="js/label.js"></script>
<script src="js/nombre.js"></script>
<script src="js/inOut.js"></script>
<script src="js/proxy.js"></script>
<script src="js/processManifest.js"></script>
<script src="js/importarManifest.js"></script>
<script src="js/secuencia.js"></script>
<script src="js/llave.js"></script>
<script src="js/ordenSugerido.js"></script>
<script src="js/deepseek.js"></script>
<script src="js/cuartosDelProyecto.js"></script>
<script src="js/pestanaOrden.js"></script>
<script src="js/autocheck-tests.js"></script>
<script>
  logToPanel("Plugin cargado.");
  correrAutocheck();

  const boton = document.getElementById("importar");
  boton.disabled = false;
  boton.addEventListener("click", async () => {
    boton.disabled = true;
    try {
      await importarManifestDesdeArchivo();
    } catch (e) {
      logToPanel(e.message + " | " + e.stack, true);
      document.getElementById("status").textContent = "Listo.";
    } finally {
      boton.disabled = false;
    }
  });

  // Las pestanas. La de importar es la que Bruno usa todos los dias, asi que
  // es la que abre.
  const pestanas = [
    { boton: document.getElementById("tab-importar"), hoja: document.getElementById("hoja-importar") },
    { boton: document.getElementById("tab-orden"), hoja: document.getElementById("hoja-orden") },
  ];
  for (const { boton: b, hoja } of pestanas) {
    b.addEventListener("click", () => {
      for (const p of pestanas) {
        const esta = p.boton === b;
        p.boton.classList.toggle("activa", esta);
        p.hoja.classList.toggle("oculto", !esta);
      }
      if (hoja.id === "hoja-orden") abrirPestanaOrden(hoja);
    });
  }
</script>

<button id="run">Probar todo junto</button>
<script>
const premierepro = require("premierepro");
const TEST_DIR = "/Users/brunogutierrez/Documents/CLAUDE CODE/ORGANIZADOR VIDEO/TEST/";
const FPS = 59.94005994005994;

// category_path: lista de cuarto/subcuarto. label: constante o null. in_out: [inFrame, outFrame] o null.
const MANIFEST = [
  { file: "20260804_PIB0587.MP4", category_path: ["Recamara 2", "Bano"], label: "FOREST", in_out: [10, 90] },
  { file: "20260804_PIB0588.MP4", category_path: ["Recamara 2"], label: "ROSE", in_out: null },
  { file: "20260804_PIB0589.MP4", category_path: ["Cocina"], label: null, in_out: [30, 200] },
];

async function getOrCreateBin(project, parentFolder, name) {
  const existing = await parentFolder.getItems();
  const found = existing.find((i) => i.name === name);
  if (found) return premierepro.FolderItem.cast(found);

  project.lockedAccess(() => {
    project.executeTransaction((compoundAction) => {
      compoundAction.addAction(parentFolder.createBinAction(name, true));
    }, "Crear bin " + name);
  });
  const afterItems = await parentFolder.getItems();
  return premierepro.FolderItem.cast(afterItems.find((i) => i.name === name));
}

document.getElementById("run").addEventListener("click", async () => {
  try {
    const project = await premierepro.Project.getActiveProject();
    const rootItem = await project.getRootItem();
    const frameRate = premierepro.FrameRate.createWithValue(FPS);

    for (const entry of MANIFEST) {
      console.log("--- procesando", entry.file, "---");

      // 1. resolver/crear la cadena de bins anidados
      let currentFolder = rootItem;
      for (const part of entry.category_path) {
        currentFolder = await getOrCreateBin(project, currentFolder, part);
      }

      // 2. importar dentro del bin final
      const path = TEST_DIR + entry.file;
      const ok = await project.importFiles([path], true, currentFolder, false);
      console.log("import:", entry.file, "->", ok);

      const itemsInBin = await currentFolder.getItems();
      const clipItem = itemsInBin.find((i) => i.name.startsWith(entry.file.replace(".MP4", "")));
      if (!clipItem) {
        console.log("ERROR: no se encontro el clip importado", entry.file);
        continue;
      }

      // 3. label
      if (entry.label) {
        project.lockedAccess(() => {
          project.executeTransaction((compoundAction) => {
            const action = clipItem.createSetColorLabelAction(
              premierepro.Constants.ProjectItemColorLabel[entry.label]
            );
            compoundAction.addAction(action);
          }, "Label " + entry.file);
        });
      }

      // 4. in/out
      if (entry.in_out) {
        const clipProjectItem = premierepro.ClipProjectItem.cast(clipItem);
        const inPoint = premierepro.TickTime.createWithFrameAndFrameRate(entry.in_out[0], frameRate);
        const outPoint = premierepro.TickTime.createWithFrameAndFrameRate(entry.in_out[1], frameRate);
        project.lockedAccess(() => {
          project.executeTransaction((compoundAction) => {
            const action = clipProjectItem.createSetInOutPointsAction(inPoint, outPoint);
            compoundAction.addAction(action);
          }, "In/out " + entry.file);
        });
      }

      console.log("OK:", entry.file, "categoria:", entry.category_path.join(" > "));
    }

    console.log("PRUEBA COMPLETA: revisa el proyecto en Premiere.");
  } catch (e) {
    console.log("ERROR:", e.message, e.stack);
  }
});
</script>

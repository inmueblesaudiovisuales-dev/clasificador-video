<div style="padding: 8px; font-family: sans-serif;">
  <h3 style="margin: 0 0 8px 0;">Spike: busqueda y auto-prueba</h3>
  <div id="log" style="font-size: 12px; line-height: 1.5;"></div>
</div>
<script>
// Este spike prueba TRES cosas a la vez:
//   1. Que el plugin corra solo al cargarse, sin que nadie presione nada.
//   2. Que pueda escribir el resultado a un archivo, para que otra sesion lo lea.
//   3. Si findItemsMatchingMediaPath sirve para localizar clips por ruta.
const premierepro = require("premierepro");

const TEST_DIR = "/Users/brunogutierrez/Documents/CLAUDE CODE/ORGANIZADOR VIDEO/TEST/";
const CLIP = TEST_DIR + "20260804_PIB0588.MP4";
const BIN_NOMBRE = "SpikeBusqueda";
const SALIDA_DIR = "/private/tmp/claude-501/-Users-brunogutierrez/8b2a1cec-aa67-4bde-bffd-7b00604c3049/scratchpad";
const SALIDA_ARCHIVO = "resultado-spike-busqueda.json";

const resultados = [];

function anotar(nombre, valor, esError) {
  resultados.push({ nombre: nombre, valor: String(valor), error: !!esError });
  const div = document.createElement("div");
  div.textContent = nombre + ": " + valor;
  if (esError) div.style.color = "#e06c75";
  document.getElementById("log").appendChild(div);
  console.log(nombre + ": " + valor);
}

async function getOrCreateBin(project, parentFolder, name) {
  const existing = await parentFolder.getItems();
  const found = existing.find((i) => i.name === name);
  if (found) return premierepro.FolderItem.cast(found);

  project.lockedAccess(() => {
    project.executeTransaction((compoundAction) => {
      compoundAction.addAction(parentFolder.createBinAction(name, true));
    }, "Crear bin " + name);
  });
  const afterItems = await parentFolder.getItems();
  return premierepro.FolderItem.cast(afterItems.find((i) => i.name === name));
}

async function buscarPorRuta(folder, ruta) {
  const items = await folder.getItems();
  for (const item of items) {
    const clip = premierepro.ClipProjectItem.cast(item);
    if (!clip) continue;
    try {
      if ((await clip.getMediaFilePath()) === ruta) return clip;
    } catch (e) {}
  }
  return null;
}

async function escribirResultado() {
  const uxpFs = require("uxp").storage.localFileSystem;
  const carpeta = await uxpFs.getEntryWithUrl("file://" + SALIDA_DIR);
  const archivo = await carpeta.createFile(SALIDA_ARCHIVO, { overwrite: true });
  await archivo.write(JSON.stringify({ cuando: new Date().toISOString(), resultados: resultados }, null, 2));
}

(async () => {
  try {
    const project = await premierepro.Project.getActiveProject();
    if (!project) {
      anotar("proyecto activo", "NINGUNO", true);
      await escribirResultado();
      return;
    }
    anotar("proyecto activo", project.name);

    const rootItem = await project.getRootItem();
    const folder = await getOrCreateBin(project, rootItem, BIN_NOMBRE);

    let clip = await buscarPorRuta(folder, CLIP);
    if (!clip) {
      await project.importFiles([CLIP], true, folder, false);
      for (let i = 1; i <= 10 && !clip; i++) {
        clip = await buscarPorRuta(folder, CLIP);
        if (!clip) await new Promise((r) => setTimeout(r, 300));
      }
    }
    anotar("clip listo", clip ? clip.name : "NO", !clip);
    if (!clip) {
      await escribirResultado();
      return;
    }

    // --- Probar findItemsMatchingMediaPath en los tres lugares plausibles ---
    // El .d.ts lo declara dentro de ClipProjectItem, lo cual es raro para una
    // operacion de proyecto. Hay que probar, no asumir.
    anotar("existe en project", typeof project.findItemsMatchingMediaPath);
    anotar("existe en rootItem", typeof rootItem.findItemsMatchingMediaPath);
    anotar("existe en clipItem", typeof clip.findItemsMatchingMediaPath);

    const candidatos = [
      ["project", project],
      ["rootItem", rootItem],
      ["clipItem", clip],
    ];

    for (const [nombre, objeto] of candidatos) {
      if (typeof objeto.findItemsMatchingMediaPath !== "function") continue;
      try {
        const encontrados = await objeto.findItemsMatchingMediaPath(CLIP, true);
        const cuantos = encontrados ? encontrados.length : 0;
        anotar("findItems desde " + nombre, cuantos + " resultado(s)");
        if (cuantos > 0) {
          const primero = premierepro.ClipProjectItem.cast(encontrados[0]);
          const ruta = primero ? await primero.getMediaFilePath() : "(no es clip)";
          anotar("  ruta del primero", ruta);
          anotar("  coincide", ruta === CLIP, ruta !== CLIP);
        }
      } catch (e) {
        anotar("findItems desde " + nombre, "FALLO: " + e.message, true);
      }
    }

    // La pregunta que decide si sirve: desde un clip, encuentra a OTRO clip?
    // Si solo se encuentra a si mismo, no sirve como buscador del proyecto.
    const OTRO = TEST_DIR + "20260804_PIB0589.MP4";
    let otro = await buscarPorRuta(folder, OTRO);
    if (!otro) {
      await project.importFiles([OTRO], true, folder, false);
      for (let i = 1; i <= 10 && !otro; i++) {
        otro = await buscarPorRuta(folder, OTRO);
        if (!otro) await new Promise((r) => setTimeout(r, 300));
      }
    }
    anotar("segundo clip listo", otro ? otro.name : "NO", !otro);

    if (otro) {
      try {
        const cruzado = await clip.findItemsMatchingMediaPath(OTRO, true);
        const n = cruzado ? cruzado.length : 0;
        anotar("desde clip A busco a clip B", n + " resultado(s)", n === 0);
        if (n > 0) {
          const p = premierepro.ClipProjectItem.cast(cruzado[0]);
          anotar("  ruta encontrada", p ? await p.getMediaFilePath() : "(no es clip)");
        }
      } catch (e) {
        anotar("desde clip A busco a clip B", "FALLO: " + e.message, true);
      }

      // Busca tambien fuera de su propio bin?
      try {
        const otroBin = await getOrCreateBin(project, rootItem, "SpikeBusquedaOtroBin");
        let lejano = await buscarPorRuta(otroBin, TEST_DIR + "20260804_PIB0587.MP4");
        if (!lejano) {
          await project.importFiles([TEST_DIR + "20260804_PIB0587.MP4"], true, otroBin, false);
          for (let i = 1; i <= 10 && !lejano; i++) {
            lejano = await buscarPorRuta(otroBin, TEST_DIR + "20260804_PIB0587.MP4");
            if (!lejano) await new Promise((r) => setTimeout(r, 300));
          }
        }
        const cruzado2 = await clip.findItemsMatchingMediaPath(TEST_DIR + "20260804_PIB0587.MP4", true);
        const n2 = cruzado2 ? cruzado2.length : 0;
        anotar("busca en OTRO bin", n2 + " resultado(s)", n2 === 0);
      } catch (e) {
        anotar("busca en OTRO bin", "FALLO: " + e.message, true);
      }
    }

    // Coincidencia parcial: si acepta un fragmento, sirve para buscar por carpeta.
    try {
      const parciales = await clip.findItemsMatchingMediaPath("20260804_PIB", true);
      anotar("busqueda parcial", (parciales ? parciales.length : 0) + " resultado(s)");
    } catch (e) {
      anotar("busqueda parcial", "FALLO: " + e.message, true);
    }

    anotar("FIN", "spike completo");
    await escribirResultado();
  } catch (e) {
    anotar("ERROR GENERAL", e.message + " | " + e.stack, true);
    try { await escribirResultado(); } catch (e2) {}
  }
})();
</script>
